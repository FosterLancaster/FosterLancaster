<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyDwdEA58IKndfdO1SvfD4pGerAbW3bRgWw",
  authDomain: "fostmp3s-3fc35.firebaseapp.com",
  databaseURL: "https://fostmp3s-3fc35-default-rtdb.firebaseio.com",
  projectId: "fostmp3s-3fc35",
  storageBucket: "fostmp3s-3fc35.firebasestorage.app",
  messagingSenderId: "792229622105",
  appId: "1:792229622105:web:a644d281c868293b131c48"
};


const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


// SAME RATE AS MAIN PLAYER
const PLAYS_PER_6H = 12300;

const RATE_PER_MS =
  PLAYS_PER_6H / (6 * 60 * 60 * 1000);


function calculateCurrentPlays(basePlays, lastUpdated) {

  if (!lastUpdated) {
    return basePlays;
  }

  const elapsed =
    Math.max(0, Date.now() - lastUpdated);

  return basePlays + Math.floor(
    elapsed * RATE_PER_MS
  );
}


function formatPlays(num) {

  if (num >= 1_000_000_000) {
    return (num / 1_000_000_000).toFixed(1) + "B";
  }

  if (num >= 1_000_000) {
    return (num / 1_000_000).toFixed(1) + "M";
  }

  if (num >= 1_000) {
    return (num / 1_000).toFixed(1) + "K";
  }

  return num.toLocaleString();
}


const songsRef = ref(database, "songs");

let songsData = {};
let highestTotalDisplayed = 0;


function updateCalculatedTotal() {

  let total = 0;

  Object.values(songsData).forEach(song => {

    if (!song) return;

    const basePlays =
      Number(song.plays) || 0;

    const lastUpdated =
      Number(song.lastUpdated) || 0;

    const dailyBoost =
      Number(song.dailyBoost) || 0;


    const currentPlays =
      calculateCurrentPlays(
        basePlays,
        lastUpdated
      ) + dailyBoost;


    total += currentPlays;

  });


  // Never visually decrease
  highestTotalDisplayed =
    Math.max(
      highestTotalDisplayed,
      total
    );


  document
    .querySelectorAll(".totalPlayCount")
    .forEach(el => {

      el.textContent =
        formatPlays(highestTotalDisplayed);

      el.title =
        highestTotalDisplayed.toLocaleString();

    });

}


onValue(

  songsRef,

  snapshot => {

    songsData = snapshot.val() || {};

    updateCalculatedTotal();

  },

  error => {

    console.error(
      "Could not load songs:",
      error
    );

  }

);


// Keep calculated total moving
setInterval(
  updateCalculatedTotal,
  1000
);

</script>
