<script>
document.addEventListener("DOMContentLoaded", () => {
  const warnings = document.querySelectorAll(".Warning");

  // Hide if already dismissed
  if (localStorage.getItem("warningDismissed") === "true") {
    warnings.forEach(warning => {
      warning.style.display = "none";
    });
  }

  document.querySelectorAll(".WarningButton").forEach(button => {
    button.addEventListener("click", function () {
      const warning = this.closest(".Warning");
      if (warning) {
        warning.style.display = "none";
        localStorage.setItem("warningDismissed", "true");
      }
    });
  });
});
</script>
